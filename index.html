<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChelaConnect | Demo</title><link rel="stylesheet" href="assets/css/styles.css"></head><body>
<header><div><b>ChelaConnect</b><small> by Marketing Connect</small></div><nav><button onclick="setPlan('basic')">Básico</button><button onclick="setPlan('premium')">Premium</button><button class="order" onclick="openCart()">Pedido <span id="count">0</span></button></nav></header>
<section class="hero"><span>DEMO CENTRO CHELERO</span><h1>LA CHELERÍA</h1><p>Arma tu bebida, agrega una botana y manda tu pedido desde la mesa.</p></section>
<main><div class="tools"><div id="filters"></div><input id="search" placeholder="Buscar en la carta..."></div><div id="grid"></div></main>
<div id="modal" class="modal hidden"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<aside id="cart"><button class="close" onclick="closeCart()">×</button><h2>Tu pedido</h2><div id="items"></div><label>Nombre del cliente<input id="name"></label><label>Número de mesa<input id="table"></label><label>Indicaciones para el negocio<textarea id="notes"></textarea></label><h3>Total: <span id="total">$0</span></h3><button class="wa" onclick="send()">Enviar pedido por WhatsApp</button></aside>
<footer>ChelaConnect · Carta digital by Marketing Connect</footer><script src="assets/js/app.js"></script></body></html>
